          - { name: contact_need, label: "Contacto: aviso si falta algo", widget: string, required: false, hint: "Ahora: Escribe tu mensaje y un correo válido para poder responderte." }
          - { name: contact_sending, label: "Contacto: Enviando", widget: string, required: false, hint: "Ahora: Enviando…" }
