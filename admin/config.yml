# =========================================================
# PANEL DE ADMINISTRACIÓN (Sveltia CMS)
# Lo único que tienes que cambiar aquí es la línea "repo".
# =========================================================

backend:
  name: github
  repo: STVRDY/stvrdy.github.io   # ← tu usuario de GitHub / nombre del repositorio
  branch: main
  commit_messages:
    create: "Nuevo: {{slug}}"
    update: "Actualizado: {{slug}}"
    delete: "Borrado: {{slug}}"
    uploadMedia: "Archivo subido: {{path}}"
    deleteMedia: "Archivo borrado: {{path}}"

site_url: https://stvrdy.github.io
display_url: https://stvrdy.github.io

# Dónde se guardan las fotos, videos cortos y PDF que subes
media_folder: assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      max_file_size: 26214400   # 25 MB por archivo
      transformations:
        raster_image:           # las fotos se convierten a WebP y se reducen solas
          format: webp
          quality: 85
          width: 2200

collections:
  - name: contenido
    label: Contenido
    icon: dashboard
    files:

      # ---------- PROYECTOS ----------
      - name: proyectos
        label: "Proyectos"
        icon: movie
        file: content/proyectos.json
        format: json
        fields:
          - name: items
            label: Proyectos
            label_singular: proyecto
            widget: list
            required: false
            add_to_top: true
            collapsed: true
            summary: "{{fields.title}} · {{fields.category}} · {{fields.format}}"
            hint: "Arrastra para cambiar el orden. El primero de la lista sale primero en la web."
            fields:
              - { name: title, label: "Título", widget: string }
              - { name: visible, label: "Visible en la web", widget: boolean, default: true, hint: "Apágalo para esconder la pieza sin borrarla." }
              - { name: featured, label: "Destacado", widget: boolean, default: false, hint: "Los 4 primeros destacados salen en el teléfono y debajo de él." }
              - name: category
                label: "Categoría"
                widget: select
                default: video
                options:
                  - { label: "Video Editing", value: video }
                  - { label: "Motion Graphics", value: motion }
                  - { label: "Montage", value: montage }
                  - { label: "Long Format", value: longform }
                  - { label: "3D", value: render3d }
                  - { label: "Branding", value: branding }
                  - { label: "Diseño", value: diseno }
                  - { label: "Foto", value: foto }
              - name: format
                label: "Formato"
                widget: select
                default: vertical
                options:
                  - { label: "Vertical 9:16", value: vertical }
                  - { label: "Horizontal 16:9", value: horizontal }
              - { name: youtube, label: "Enlace de YouTube", widget: string, required: false, hint: "Pega el enlace del video o del Short. Si no subes portada, se usa la miniatura de YouTube." }
              - { name: cover, label: "Portada", widget: image, required: false, hint: "Recomendado. Vertical 1080×1920 u horizontal 1920×1080." }
              - { name: video, label: "Video corto en bucle (opcional)", widget: file, required: false, accept: "video/mp4,video/webm", hint: "Solo loops cortos y livianos (menos de 25 MB, sin sonido). Los videos largos van en YouTube." }
              - { name: images, label: "Más imágenes", widget: image, multiple: true, required: false }
              - { name: client, label: "Cliente", widget: string, required: false }
              - { name: role, label: "Tu rol", widget: string, required: false, hint: "Ej.: Edición y color" }
              - { name: year, label: "Año", widget: string, required: false }
              - { name: description, label: "Descripción", widget: text, required: false }

      # ---------- PERFIL ----------
      - name: perfil
        label: "Perfil y contacto"
        icon: person
        file: content/perfil.json
        format: json
        fields:
          - { name: name, label: "Nombre", widget: string }
          - { name: role, label: "A qué te dedicas", widget: string }
          - { name: status, label: "Estado", widget: string, hint: "Ej.: Disponible para proyectos" }
          - { name: location, label: "Ubicación", widget: string, required: false }
          - { name: avatar, label: "Foto de perfil", widget: image, required: false, hint: "Cuadrada, mínimo 400×400." }
          - { name: logo, label: "Logo (círculo del menú)", widget: image, required: false, hint: "Si lo dejas vacío, el menú usa tu foto o tus iniciales." }
          - { name: cv, label: "CV (PDF)", widget: file, required: false, accept: "application/pdf" }
          - { name: email, label: "Correo", widget: string }
          - { name: form_key, label: "Clave de Web3Forms (para recibir mensajes)", widget: string, required: false, hint: "Sin esta clave, los mensajes del chat y del formulario no te llegan. Cómo conseguirla: GUIA.md, sección Recibir mensajes." }
          - { name: whatsapp, label: "WhatsApp", widget: string, required: false, hint: "Solo números, con código de país. Ej.: 18095551234" }
          - name: chat
            label: "Mensajes del chat de inicio"
            widget: list
            required: false
            hint: "Se escriben solos, uno por uno, en la tarjeta de perfil."
            field: { name: mensaje, label: "Mensaje", widget: string }
          - { name: about, label: "Sobre mí (texto que se ilumina)", widget: text }
          - name: tags
            label: "Píldoras @ alrededor del perfil"
            widget: list
            required: false
            field: { name: tag, label: "Texto", widget: string }
          - name: marquee
            label: "Palabras de la marquesina"
            widget: list
            required: false
            field: { name: palabra, label: "Palabra", widget: string }
          - name: socials
            label: "Redes"
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Nombre", widget: string }
              - { name: url, label: "Enlace", widget: string, required: false }

      # ---------- TRAYECTORIA ----------
      - name: trayectoria
        label: "Trayectoria"
        icon: workspace_premium
        file: content/trayectoria.json
        format: json
        fields:
          - { name: image, label: "Imagen de la tarjeta grande", widget: image, required: false }
          - name: stats
            label: "Cifras (las 3 primeras)"
            widget: list
            required: false
            max: 3
            summary: "{{fields.value}}{{fields.suffix}} {{fields.label}}"
            fields:
              - { name: value, label: "Número", widget: number, value_type: int }
              - { name: suffix, label: "Sufijo", widget: string, required: false, hint: "Ej.: +  o  k+" }
              - { name: label, label: "Texto", widget: string }
          - name: programs
            label: "Programas"
            widget: list
            required: false
            field: { name: programa, label: "Programa", widget: string }
          - name: languages
            label: "Idiomas"
            widget: list
            required: false
            summary: "{{fields.name}} · {{fields.level}}"
            fields:
              - { name: name, label: "Idioma", widget: string }
              - { name: level, label: "Nivel", widget: string, required: false }
          - name: services
            label: "Servicios"
            widget: list
            required: false
            field: { name: servicio, label: "Servicio", widget: string }
          - name: workflow
            label: "Workflow (pasos de trabajo)"
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: "Se numeran solos en el orden de la lista."
            fields:
              - { name: title, label: "Paso", widget: string }
              - { name: text, label: "Descripción", widget: text, required: false }
              - { name: image, label: "Imagen", widget: image, required: false }
          - name: experience
            label: "Experiencia"
            widget: list
            required: false
            summary: "{{fields.role}} · {{fields.company}}"
            fields:
              - { name: role, label: "Puesto", widget: string }
              - { name: company, label: "Empresa", widget: string }
              - { name: logo, label: "Logo de la empresa", widget: image, required: false, hint: "PNG o SVG, mejor cuadrado y con fondo transparente o blanco." }
              - { name: years, label: "Fechas", widget: string, required: false, hint: "Ej.: Mar. 2026 — Actualidad" }
              - { name: current, label: "Es mi trabajo actual", widget: boolean, default: false, required: false, hint: "Muestra la etiqueta verde 'Actual'. También sale sola si las fechas dicen 'Actualidad' o 'hoy'." }
              - { name: description, label: "Qué hacías (opcional)", widget: text, required: false }

      # ---------- MENSAJES ----------
      - name: mensajes
        label: "Mensajes de clientes"
        icon: chat
        file: content/mensajes.json
        format: json
        fields:
          - name: items
            label: "Mensajes"
            label_singular: mensaje
            widget: list
            required: false
            summary: "{{fields.name}} — {{fields.message}}"
            fields:
              - { name: name, label: "Nombre", widget: string }
              - { name: role, label: "Cargo (debajo del nombre)", widget: string, required: false, hint: "Ej.: Dirección creativa. Si lo dejas vacío dice 'Cliente'." }
              - { name: photo, label: "Foto", widget: image, required: false, hint: "Si no hay foto, salen sus iniciales." }
              - { name: company, label: "Empresa (arriba a la izquierda)", widget: string, required: false }
              - { name: date, label: "Fecha (arriba a la derecha)", widget: string, required: false, hint: "Ej.: Mar. 2026" }
              - { name: message, label: "Mensaje", widget: text }
              - { name: emoji, label: "Emoji de la pestaña", widget: string, default: "⚡", required: false }
              - { name: tag, label: "Frase de la pestaña", widget: string, required: false, hint: "Corta. Ej.: Entrega en 24 horas. Si la dejas vacía, sale la empresa." }
              - name: color
                label: "Color de la pestaña"
                widget: select
                required: false
                options:
                  - { label: "Verde", value: verde }
                  - { label: "Azul", value: azul }
                  - { label: "Rosa", value: rosa }
                  - { label: "Naranja", value: naranja }
                  - { label: "Morado", value: morado }
                  - { label: "Amarillo", value: amarillo }

      # ---------- PREGUNTAS FRECUENTES ----------
      - name: faq
        label: "Preguntas frecuentes"
        icon: help
        file: content/faq.json
        format: json
        fields:
          - name: items
            label: "Preguntas"
            label_singular: pregunta
            widget: list
            required: false
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: "Pregunta", widget: string }
              - { name: a, label: "Respuesta", widget: text }

      # ---------- TEXTOS DE LA PÁGINA ----------
      - name: textos
        label: "Textos de la página (menú, títulos, botones)"
        icon: translate
        file: content/textos.json
        format: json
        fields:
          - { name: lang, label: "Idioma de la página (en / es)", widget: string, required: false, hint: "Ahora: es" }
          - { name: nav_work, label: "Menú: Trabajo", widget: string, required: false, hint: "Ahora: Trabajo" }
          - { name: nav_about, label: "Menú: Sobre mí", widget: string, required: false, hint: "Ahora: Sobre mí" }
          - { name: nav_background, label: "Menú: Trayectoria", widget: string, required: false, hint: "Ahora: Trayectoria" }
          - { name: say_hi, label: "Botón Say Hi", widget: string, required: false, hint: "Ahora: Say Hi!" }
          - { name: featured_title, label: "Destacados: título", widget: string, required: false, hint: "Ahora: Trabajos destacados" }
          - { name: featured_sub, label: "Destacados: subtítulo", widget: string, required: false, hint: "Ahora: Lo que mejor me representa." }
          - { name: work_title, label: "Trabajo: título", widget: string, required: false, hint: "Ahora: Mi trabajo" }
          - { name: work_sub, label: "Trabajo: subtítulo", widget: string, required: false, hint: "Ahora: De la idea a la entrega" }
          - { name: see_more, label: "Botón Ver más", widget: string, required: false, hint: "Ahora: Ver más" }
          - { name: see_less, label: "Botón Ver menos", widget: string, required: false, hint: "Ahora: Ver menos" }
          - { name: background_title, label: "Trayectoria: título", widget: string, required: false, hint: "Ahora: Trayectoria" }
          - { name: background_sub, label: "Trayectoria: subtítulo", widget: string, required: false, hint: "Ahora: Lo que he hecho y con qué lo hago." }
          - { name: programs_title, label: "Trayectoria: Programas", widget: string, required: false, hint: "Ahora: Programas" }
          - { name: languages_title, label: "Trayectoria: Idiomas", widget: string, required: false, hint: "Ahora: Idiomas" }
          - { name: experience_title, label: "Trayectoria: Experiencia", widget: string, required: false, hint: "Ahora: Experiencia" }
          - { name: services_title, label: "Trayectoria: Servicios", widget: string, required: false, hint: "Ahora: Servicios" }
          - { name: workflow_title, label: "Workflow: título", widget: string, required: false, hint: "Ahora: De la idea al corte final." }
          - { name: workflow_sub, label: "Workflow: subtítulo", widget: string, required: false, hint: "Ahora: Un proceso claro para que cada proyecto llegue a tiempo." }
          - { name: messages_title, label: "Mensajes: título", widget: string, required: false, hint: "Ahora: Lo que dicen" }
          - { name: messages_sub, label: "Mensajes: subtítulo", widget: string, required: false, hint: "Ahora: Mensajes de clientes y colegas." }
          - { name: contact_title, label: "Contacto: título", widget: string, required: false, hint: "Ahora: Say Hi! 👋" }
          - { name: contact_sub, label: "Contacto: subtítulo", widget: string, required: false, hint: "Ahora: Un mensaje nuevo. Respondo en menos de 24 horas." }
          - { name: contact_to, label: "Contacto: Para", widget: string, required: false, hint: "Ahora: Para:" }
          - { name: contact_from, label: "Contacto: De", widget: string, required: false, hint: "Ahora: De:" }
          - { name: contact_name, label: "Contacto: campo nombre", widget: string, required: false, hint: "Ahora: Tu nombre" }
          - { name: contact_message, label: "Contacto: campo mensaje", widget: string, required: false, hint: "Ahora: Cuéntame tu proyecto…" }
          - { name: contact_whatsapp, label: "Contacto: enlace WhatsApp", widget: string, required: false, hint: "Ahora: Mejor por WhatsApp" }
          - { name: faq_title, label: "Menú •••: título preguntas", widget: string, required: false, hint: "Ahora: Preguntas frecuentes" }
          - { name: cv_button, label: "Menú •••: botón CV", widget: string, required: false, hint: "Ahora: Descargar CV" }
          - { name: close, label: "Menú •••: botón cerrar", widget: string, required: false, hint: "Ahora: Cerrar" }
          - { name: cat_all, label: "Filtro: Todo", widget: string, required: false, hint: "Ahora: Todo" }
          - { name: cat_video, label: "Filtro: Video", widget: string, required: false, hint: "Ahora: Video" }
          - { name: cat_motion, label: "Filtro: Motion", widget: string, required: false, hint: "Ahora: Motion" }
          - { name: cat_montage, label: "Filtro: Montage", widget: string, required: false, hint: "Ahora: Montaje" }
          - { name: cat_longform, label: "Filtro: Long Format", widget: string, required: false, hint: "Ahora: Formato largo" }
