<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhael Baez — Portfolio</title>
<meta name="description" content="Video editor and motion designer specializing in short form content, reels and commercial editing. Crafting videos people actually finish watching.">
<meta property="og:type" content="website">
<meta property="og:title" content="Jhael Baez — Video Editor & Motion Designer">
<meta property="og:description" content="Crafting videos that people actually finish watching.">
<meta property="og:url" content="https://stvrdy.github.io/">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--
  ESTRUCTURA DE LA PÁGINA
  El texto y las fotos NO se escriben aquí: vienen de los archivos en /content
  (o del panel en /admin). Aquí solo está el "esqueleto" de cada sección.
-->

<div class="sky" aria-hidden="true"></div>

<!-- ===== MENÚ ===== -->
<nav class="nav lg lg-dark" id="nav" aria-label="Principal">
  <a class="nav-logo" href="#top" aria-label="Inicio"><span id="navLogo">JB</span></a>
  <div class="nav-links">
    <a href="#trabajo" data-t="nav_work">Trabajo</a>
    <a href="#sobre" data-t="nav_about">Sobre mí</a>
    <a href="#trayectoria" data-t="nav_background">Trayectoria</a>
    <a href="#galeria" data-t="nav_gallery">Galería</a>
  </div>
  <button class="nav-more" id="moreBtn" aria-label="Más opciones">•••</button>
  <a class="nav-hi lg lg-light" href="#contacto" data-t="say_hi">Say Hi!</a>
</nav>

<main id="top">

  <!-- ===== PERFIL (estilo iMessage) + tarjetas en abanico ===== -->
  <section class="hero" data-scene="sticky" id="hero">
    <div class="hero-stage">
      <div class="fan" id="fan" aria-hidden="true"></div>
      <div class="tags" id="tags" aria-hidden="true"></div>

      <article class="profile" id="profile">
        <div class="avatar" id="avatar" title="Foto de perfil"></div>
        <h1 class="p-name" id="pName"></h1>
        <p class="p-status"><span class="dot"></span><span id="pStatus"></span></p>
        <div class="msgs" id="chat" aria-live="polite"></div>
        <form class="bar" id="chatForm" autocomplete="off">
          <input id="chatInput" placeholder="iMessage" readonly aria-label="Escribe un mensaje">
          <button class="send" aria-label="Enviar">↑</button>
        </form>
      </article>
    </div>
    <div class="scroll-hint" aria-hidden="true"><span></span></div>
  </section>

  <!-- ===== SOBRE MÍ (texto que se ilumina al bajar) ===== -->
  <section class="about" id="sobre" data-scene="pass">
    <p class="reveal-words" id="about"></p>
  </section>

  <!-- ===== DESTACADOS (teléfono que sale de la caja) ===== -->
  <section class="featured wrap" id="trabajo">
    <header class="sec-head">
      <h2 data-t="featured_title">Trabajos destacados</h2>
      <p data-t="featured_sub"></p>
    </header>
    <div class="box-scene" data-scene="pass" id="boxScene">
      <div class="box"></div>
      <div class="box-clip">
        <button class="phone" id="phone" aria-label="Ver proyecto destacado">
          <span class="phone-screen" id="phoneScreen"></span>
          <span class="phone-island"></span>
        </button>
      </div>
      <div class="box-pills" id="boxPills" aria-hidden="true"></div>
    </div>
    <div class="feat-row" id="featRow"></div>
  </section>

  <!-- ===== MARQUESINA ===== -->
  <div class="marquee" data-scene="pass" id="marquee" aria-hidden="true"><div class="marquee-track" id="marqueeTrack"></div></div>

  <!-- ===== TODO EL TRABAJO (cuadrícula con filtros) ===== -->
  <section class="work wrap" id="todo">
    <header class="work-head">
      <h2><span data-t="work_title">Mi trabajo</span><br><span class="soft" data-t="work_sub">De la idea a la entrega</span></h2>
    </header>
    <div class="work-bar">
      <div class="filters" id="filters" role="tablist"></div>
      <div class="ratio lg lg-light" role="group" aria-label="Formato">
        <button class="on" data-format="vertical" aria-label="Vertical 9:16"><i class="ic-v"></i></button>
        <button data-format="horizontal" aria-label="Horizontal 16:9"><i class="ic-h"></i></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="btn lg lg-blue more" id="moreWork" data-t="see_more">Ver más</button>
  </section>

  <!-- ===== TRAYECTORIA (bento) ===== -->
  <section class="bento-sec wrap" id="trayectoria">
    <header class="sec-head center">
      <h2 data-t="background_title">Trayectoria</h2>
      <p data-t="background_sub"></p>
    </header>
    <div class="bento" id="bento"></div>
  </section>

  <!-- ===== WORKFLOW (pasos de trabajo) ===== -->
  <section class="workflow wrap" id="workflow">
    <header class="sec-head">
      <h2 data-t="workflow_title">From idea to final cut.</h2>
      <p data-t="workflow_sub"></p>
    </header>
    <div class="flow-row" id="flowRow"></div>
  </section>

  <!-- ===== GALERÍA (imágenes dispersas) ===== -->
  <section class="gallery" id="galeria" data-scene="pass">
    <div class="scatter" id="scatter" aria-hidden="true"></div>
    <div class="gallery-center">
      <h2 class="reveal-words" id="galleryTitle"></h2>
      <button class="btn lg lg-dark" id="openGallery" data-t="gallery_button">Ver galería</button>
    </div>
  </section>

  <!-- ===== MENSAJES (testimonios) ===== -->
  <section class="msec" id="mensajes" data-scene="pass">
    <header class="sec-head center wrap">
      <h2 data-t="messages_title">Lo que dicen</h2>
      <p data-t="messages_sub"></p>
    </header>
    <div class="row" id="row1"></div>
    <div class="row" id="row2"></div>
  </section>

  <!-- ===== CONTACTO ===== -->
  <section class="contact wrap" id="contacto">
    <header class="sec-head center">
      <h2 data-t="contact_title">Say Hi!</h2>
      <p data-t="contact_sub"></p>
    </header>
    <!-- Los mensajes se envían con Web3Forms (ver GUIA.md, "Recibir mensajes") -->
    <form class="compose" id="cForm" novalidate>
      <div class="to"><span data-t="contact_to">Para:</span> <b id="toName"></b></div>
      <label class="to"><span data-t="contact_from">De:</span> <input id="cName" name="name" autocomplete="name"></label>
      <label class="to"><span data-t="contact_email_label">Correo:</span> <input id="cEmail" name="email" type="email" autocomplete="email" required></label>
      <div class="c-sent" id="cSent" aria-live="polite"></div>
      <div class="compose-bar">
        <textarea id="cMsg" name="message" rows="4" required></textarea>
        <button class="send" id="cSend" type="submit" aria-label="Enviar">↑</button>
      </div>
      <p class="c-status" id="cStatus" role="status"></p>
    </form>
    <div class="alt">
      <a id="cWa" href="#" target="_blank" rel="noopener" data-t="contact_whatsapp">Mejor por WhatsApp</a>
      <button type="button" class="copy-mail" id="cCopy">Copiar correo</button>
    </div>
    <div class="socials" id="socials"></div>
  </section>
</main>

<footer class="foot">
  <span id="copy">©</span> <span id="footName"></span>
</footer>

<!-- ===== VENTANAS (menú •••, visor de proyectos, galería) ===== -->
<dialog class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></dialog>
<dialog class="viewer" id="viewer"><div class="viewer-in" id="viewerIn"></div></dialog>

<!-- Filtro SVG del efecto "liquid glass" (lo usa js/liquid-glass.js) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="lgDefs"></defs></svg>

<script src="js/liquid-glass.js"></script>
<script src="js/main.js"></script>
</body>
</html>
